
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 2 — Sefer Mada Prototype</title>

<style>
:root{
  --bg:#f6f3ec;
  --panel:#fffdf8;
  --ink:#111827;
  --muted:#6b7280;
  --line:#ddd6ca;
  --navy:#101827;
  --gold:#b08d57;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#faf8f3,#f6f3ec);
  color:var(--ink);
  padding:24px;
}

.wrap{
  max-width:980px;
  margin:auto;
}

.hero{
  background:linear-gradient(135deg,#101827,#273247);
  color:white;
  border-radius:30px;
  padding:50px 30px;
  text-align:center;
  margin-bottom:24px;
}

.hero .heb{
  direction:rtl;
  font-size:42px;
  font-weight:900;
  margin-bottom:12px;
}

.hero h1{
  margin:0;
  font-size:40px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

button{
  border:none;
  border-radius:14px;
  padding:10px 16px;
  background:white;
  border:1px solid var(--line);
  cursor:pointer;
  font-weight:700;
}

button.active{
  background:var(--navy);
  color:white;
}

.path{
  display:grid;
  gap:10px;
}

.node{
  background:rgba(255,253,248,.92);
  border:1px solid var(--line);
  border-radius:26px;
  padding:24px;
  text-align:center;
  transition:.25s;
  position:relative;
}

.node:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 40px rgba(0,0,0,.08);
  border-color:rgba(176,141,87,.7);
}

.node.hidden-name .main-name{
  opacity:0;
}

.node.hidden-theme .theme{
  opacity:0;
}

.circle{
  width:42px;
  height:42px;
  border-radius:999px;
  background:#efe6d7;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  margin-bottom:14px;
  font-weight:900;
}

.arrow{
  text-align:center;
  font-size:32px;
  color:var(--gold);
}

.heb{
  direction:rtl;
  font-size:24px;
  font-weight:900;
}

.eng{
  font-size:18px;
  font-weight:800;
  margin-top:8px;
}

.theme{
  margin-top:12px;
  color:var(--muted);
  line-height:1.5;
}

.quiz{
  margin-top:28px;
  background:white;
  border:1px solid var(--line);
  border-radius:26px;
  padding:26px;
}

.quiz h2{
  margin-top:0;
}

input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  box-sizing:border-box;
  margin-top:10px;
  font-size:16px;
}

.feedback{
  margin-top:16px;
  padding:14px;
  border-radius:14px;
  display:none;
}

.good{
  background:#ecfdf5;
  border:1px solid #86efac;
}

.bad{
  background:#fef2f2;
  border:1px solid #fca5a5;
}

.structure{
  margin-top:28px;
  background:white;
  border:1px solid var(--line);
  border-radius:26px;
  padding:26px;
}

.tree{
  border-left:3px solid #d1d5db;
  margin-left:18px;
  padding-left:18px;
  display:grid;
  gap:10px;
}

.branch{
  position:relative;
  padding:12px;
  border-radius:18px;
  background:#faf8f3;
}

.branch::before{
  content:"";
  position:absolute;
  width:16px;
  height:2px;
  background:#d1d5db;
  left:-18px;
  top:24px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
  <div class="heb">ספר המדע</div>
  <h1>Sefer Mada</h1>
</div>

<div class="controls">
  <button class="active" onclick="toggleNames(this)">Hide / Reveal Names</button>
  <button class="active" onclick="toggleThemes(this)">Hide / Reveal Themes</button>
  <button onclick="randomMissing()">Missing Piece Challenge</button>
  <button onclick="resetPath()">Reset Path</button>
</div>

<div id="path" class="path"></div>

<div class="quiz">
  <h2>Active Retrieval</h2>
  <p id="prompt"></p>

  <input id="answer" placeholder="Type the Hilchah name">

  <div class="controls" style="margin-top:14px;">
    <button class="active" onclick="checkAnswer()">Check</button>
    <button onclick="nextQuestion()">Next</button>
  </div>

  <div id="feedback" class="feedback"></div>
</div>

<div class="structure">
  <h2>Structure View</h2>

  <div class="tree" id="tree"></div>
</div>

</div>

<script>

const hilchot = [
{
n:1,
hebrew:"הלכות יסודי התורה",
english:"Yesodei HaTorah",
short:"Foundations",
theme:"Foundations of belief and knowing Hashem."
},
{
n:2,
hebrew:"הלכות דעות",
english:"De'ot",
short:"Character",
theme:"Character refinement and balanced conduct."
},
{
n:3,
hebrew:"הלכות תלמוד תורה",
english:"Talmud Torah",
short:"Torah Study",
theme:"The mitzvah and structure of Torah learning."
},
{
n:4,
hebrew:"הלכות עבודה זרה",
english:"Avodah Zarah",
short:"Falsehood",
theme:"Rejecting idolatry and false systems."
},
{
n:5,
hebrew:"הלכות תשובה",
english:"Teshuvah",
short:"Return",
theme:"Return, repair, and closeness to Hashem."
}
];

let currentQuestion = 0;
let hiddenNameMode = false;
let hiddenThemeMode = false;

function renderPath(hiddenIndex=null){

const path = document.getElementById("path");

path.innerHTML = hilchot.map((h,index)=>`

<div>

<div class="node ${hiddenNameMode ? "hidden-name" : ""} ${hiddenThemeMode ? "hidden-theme" : ""}">

<div class="circle">${h.n}</div>

<div class="main-name">
<div class="heb">${hiddenIndex===index ? "???" : h.hebrew}</div>
<div class="eng">${hiddenIndex===index ? "???" : h.english}</div>
</div>

<div class="theme">
${h.short} → ${h.theme}
</div>

</div>

${index < hilchot.length-1 ? '<div class="arrow">↓</div>' : ''}

</div>

`).join("");

}

function toggleNames(btn){
hiddenNameMode = !hiddenNameMode;
btn.classList.toggle("active");
renderPath();
}

function toggleThemes(btn){
hiddenThemeMode = !hiddenThemeMode;
btn.classList.toggle("active");
renderPath();
}

function randomMissing(){
const hiddenIndex = Math.floor(Math.random()*hilchot.length);
renderPath(hiddenIndex);
}

function resetPath(){
renderPath();
}

function nextQuestion(){

currentQuestion = Math.floor(Math.random()*hilchot.length);

document.getElementById("prompt").innerHTML =
"What Hilchah deals with:<br><br><strong>" +
hilchot[currentQuestion].theme +
"</strong>";

document.getElementById("answer").value = "";

const fb = document.getElementById("feedback");
fb.style.display = "none";
fb.className = "feedback";

}

function normalize(v){
return v.toLowerCase().replace(/[^a-zא-ת]/g,"");
}

function checkAnswer(){

const guess = normalize(document.getElementById("answer").value);

const answers = [
normalize(hilchot[currentQuestion].english),
normalize(hilchot[currentQuestion].hebrew)
];

const correct = answers.includes(guess);

const fb = document.getElementById("feedback");

fb.style.display = "block";

if(correct){

fb.className = "feedback good";

fb.innerHTML =
"<strong>Correct.</strong><br>" +
hilchot[currentQuestion].english;

}else{

fb.className = "feedback bad";

fb.innerHTML =
"<strong>Not quite.</strong><br>" +
"Answer: " +
hilchot[currentQuestion].english;

}

}

function renderTree(){

const tree = document.getElementById("tree");

tree.innerHTML = hilchot.map(h=>`

<div class="branch">

<div class="heb">${h.hebrew}</div>

<div class="eng">${h.english}</div>

<div class="theme">${h.theme}</div>

</div>

`).join("");

}

renderPath();
renderTree();
nextQuestion();

</script>

</body>
</html>
